<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg_ok" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3BDCD8" stop-opacity="1" />
      <stop offset="100%" stop-color="#10C6C1" stop-opacity="1" />
    </linearGradient>
  </defs>

  <!-- Drop shadow (translucent offset rect; SVG filters are not renderer-safe) -->
  <rect x="6" y="8" width="112" height="112" rx="16" ry="16" fill="#000000" fill-opacity="0.18" />

  <!-- Background rounded rectangle with gradient -->
  <rect x="4" y="4" width="112" height="112" rx="16" ry="16" fill="url(#bg_ok)" />

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="104" height="104" rx="13" ry="13" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" />

  <!-- Airplane silhouette (top-right decorative) -->
  <g transform="translate(75, 18) scale(0.6)">
    <path d="M40,20 L30,15 L25,5 L22,5 L24,15 L15,18 L8,14 L6,15 L12,20 L6,25 L8,26 L15,22 L22,28 L18,35 L20,36 L26,30 L32,35 L34,34 L30,28 L38,24 L44,28 L46,27 L40,22 Z" fill="#FFFFFF" fill-opacity="0.25" />
  </g>

  <!-- IATA code (main text) -->
  <text x="60" y="87" font-family="sans-serif" font-size="42"
        font-weight="bold" fill="#FFFFFF" text-anchor="middle">OK</text>

  <!-- Airline name (bottom, truncated if needed) -->
  <text x="60" y="104" font-family="sans-serif" font-size="10"
        fill="#FFFFFF" fill-opacity="0.8" text-anchor="middle">Czech Airlines</text>
</svg>
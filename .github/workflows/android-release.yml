name: Android CI & Package Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Build Debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Rename APK Artifact
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FlightLogger-debug.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlightLogger-APK
          path: app/build/outputs/apk/debug/FlightLogger-debug.apk
